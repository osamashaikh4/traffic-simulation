{# Inline stroke icons (Lucide-style, 24px grid). Usage: {{ icon('home') }} #}
{% macro icon(name, size=16) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'home' -%}
  <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h5v-6h4v6h5V9"/>
{%- elif name == 'reports' -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M9 9v11"/>
{%- elif name == 'analytics' -%}
  <path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/>
{%- elif name == 'download' -%}
  <path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>
{%- elif name == 'trash' -%}
  <path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>
{%- elif name == 'menu' -%}
  <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
{%- elif name == 'play' -%}
  <path d="M7 4.5v15l12-7.5z" fill="currentColor"/>
{%- elif name == 'arrow-right' -%}
  <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
{%- elif name == 'chevron-left' -%}
  <path d="m15 6-6 6 6 6"/>
{%- elif name == 'chevron-right' -%}
  <path d="m9 6 6 6-6 6"/>
{%- elif name == 'sidebar' -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="m15 10-2 2 2 2"/>
{%- elif name == 'sidebar-open' -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="m13 10 2 2-2 2"/>
{%- elif name == 'repeat' -%}
  <path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>
{%- elif name == 'stop' -%}
  <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
{%- elif name == 'edit' -%}
  <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
{%- elif name == 'skip' -%}
  <path d="M5 5v14l9-7z" fill="currentColor"/><path d="M17 5v14"/>
{%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == 'moon' -%}
  <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>
{%- elif name == 'rain' -%}
  <path d="M7 15a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19 9a4 4 0 0 1-1 7.9"/><path d="M8 19l-1 2M12 18l-1 3M16 19l-1 2"/>
{%- elif name == 'compare' -%}
  <rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/>
{%- elif name == 'lock' -%}
  <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == 'expand' -%}
  <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
{%- elif name == 'replay' -%}
  <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M10 9v6l5-3z" fill="currentColor"/>
{%- elif name == 'play-circle' -%}
  <circle cx="12" cy="12" r="10" fill="currentColor" stroke="none" opacity=".95"/><path d="M10 8.2v7.6l6-3.8z" fill="#0c1629" stroke="none"/>
{%- elif name == 'grid' -%}
  <rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor" stroke="none"/><rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor" stroke="none"/><rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor" stroke="none"/><rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor" stroke="none"/>
{%- elif name == 'history' -%}
  <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/>
{%- elif name == 'bars' -%}
  <rect x="4" y="12" width="4" height="9" rx="1" fill="currentColor" stroke="none"/><rect x="10" y="7" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="16" y="3" width="4" height="18" rx="1" fill="currentColor" stroke="none"/>
{%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M12 11v6" stroke="#0c1629" stroke-width="2.4"/><circle cx="12" cy="7.5" r="1.4" fill="#0c1629" stroke="none"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2.5"/>
{%- elif name == 'car' -%}
  <path d="M4.5 11.5l1.7-4.3A2.5 2.5 0 0 1 8.5 5.6h7a2.5 2.5 0 0 1 2.3 1.6l1.7 4.3A2.5 2.5 0 0 1 21 13.8V18a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1v-1h-11v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4.2a2.5 2.5 0 0 1 1.5-2.3z" fill="currentColor" stroke="none"/><path d="M6.6 11l1.2-3.1c.2-.5.6-.8 1.1-.8h6.2c.5 0 .9.3 1.1.8l1.2 3.1z" fill="#0c1629" stroke="none" opacity=".55"/><circle cx="7" cy="14.5" r="1.4" fill="#0c1629" stroke="none"/><circle cx="17" cy="14.5" r="1.4" fill="#0c1629" stroke="none"/>
{%- elif name == 'close' -%}
  <path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'alert' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.5"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro status(level) -%}
<span class="status status-{{ level|lower }}"><span class="dot" aria-hidden="true"></span>{{ level }}</span>
{%- endmacro %}
